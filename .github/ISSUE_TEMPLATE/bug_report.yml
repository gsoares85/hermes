name: Bug report
description: Something behaves differently from what it promises
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the Security tab
        instead: Security > Report a vulnerability.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest sequence of steps that shows the problem.
      placeholder: |
        1. Connect to ...
        2. Open ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Hermes version
      description: The output of `hermes --version`.
    validations:
      required: true

  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: "16.4"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with anything sensitive removed.
      render: text
