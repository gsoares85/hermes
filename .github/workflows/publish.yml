name: Publish

# Builds the binaries for a tag and publishes the GitHub release. Called by the
# release workflow after it creates the tag, and reusable on its own for a
# republish.
#
# It runs apart from the pull request pipeline on purpose: when code signing
# arrives with 1.0, its credentials belong here, where a pull request from a
# fork can never reach them.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string
  # Run by hand against a tag that already exists. Two uses: finishing a release
  # whose publish failed after the tag was pushed, and exercising this workflow
  # on demand — nothing in the pull request pipeline runs it, so a change to the
  # build, the checksums or the artifact actions is otherwise only tested by the
  # next real release.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, in the form vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

# Declared here rather than written into the step, so the version the release is
# built with cannot drift from the one the pull request pipeline tested.
env:
  NODE_VERSION: "22"

# Every job carries a timeout. Without one GitHub applies its own default of six
# hours, which is not a limit so much as the absence of one: a step that stalls
# rather than fails — an apt mirror that stops answering mid-install is the one
# seen here — holds a runner for the rest of the working day and reports nothing
# while it does. The numbers below are several times the observed duration of
# each job, so they are reached by a hang and not by a slow morning.

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/linux-webview
        if: runner.os == 'Linux'

      - name: Build the frontend
        run: |
          npm ci --ignore-scripts
          npm run build
        working-directory: frontend

      # The version is injected, never written into a file: the release is the
      # version, so a build outside this workflow keeps reporting "dev".
      - name: Build the binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          module="github.com/gsoares85/hermes/internal/version"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Read from the checked out tag, not from GITHUB_SHA: when this
          # workflow is called by the release workflow, GITHUB_SHA is the commit
          # that triggered it, and the binary would advertise a provenance that
          # does not match the code it was built from.
          commit="$(git rev-parse --short=7 HEAD)"
          ldflags="-s -w -X $module.Version=$TAG -X $module.Commit=$commit -X $module.Date=$built"
          go build -trimpath -ldflags "$ldflags" -o "dist/hermes-${{ matrix.target }}$suffix" ./cmd/hermes
          go build -trimpath -ldflags "$ldflags" -o "dist/hermes-cli-${{ matrix.target }}$suffix" ./cmd/hermes-cli

      - name: Check the injected version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          commit="$(git rev-parse --short=7 HEAD)"
          reported="$(./dist/hermes-cli-${{ matrix.target }}$suffix -version)"
          echo "$reported"
          # The commit is checked alongside the tag: a binary that reports a
          # commit nobody can resolve is as broken as one reporting no version.
          for want in "$TAG" "$commit"; do
            case "$reported" in
              *"$want"*) ;;
              *) echo "the binary reports $reported, expected it to carry $want" && exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Checksum every artifact
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      # Before 1.0 the release is published as it is built. From 1.0 on it is
      # created as a draft, because from then on the notes are reviewed by hand
      # and the signing step lands in this workflow.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The tag also arrives from workflow_dispatch and workflow_call, so it
          # is checked before it is taken apart: a non-numeric major would abort
          # the comparison below with a syntax error instead of a useful message.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to publish $TAG: expected the form vX.Y.Z" && exit 1 ;;
          esac
          # A published release is never rewritten, so an existing one ends the
          # job here instead of failing it. That is what makes a dispatch run
          # usable as a check: everything above — building on three platforms,
          # verifying the injected version and commit, uploading, downloading
          # and checksumming — has already run by this point.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; nothing was rewritten." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          major="${TAG#v}"
          major="${major%%.*}"
          draft=""
          if [ "$major" -ge 1 ]; then draft="--draft"; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $draft \
            artifacts/*
