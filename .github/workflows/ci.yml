name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  commits:
    name: Commit authorship
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Authorship is exclusive and no commit credits an AI assistant. That is a
      # rule of the project, so it is checked by the pipeline instead of trusted
      # to discipline.
      #
      # The branch name is chosen by whoever opens the pull request, and Git
      # allows $, backticks, semicolons and pipes in a ref. Interpolated into
      # run: it would be a command; through the environment it is only ever a
      # value, because the expansion happens before a shell exists.
      - name: Check commits and branch name
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          go run ./scripts/checkcommits \
            -range="$BASE_SHA..$HEAD_SHA" \
            -branch="$BRANCH"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint Go
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint Go with the integration tag
        run: golangci-lint run --build-tags=integration

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      # The README is the only public entry point of the repository, so it must
      # never point at files that are not published with it.
      - name: Check README references
        run: make check-readme

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out -coverpkg=./internal/... ./internal/...

      # Below the floor the build fails, and a profile that measured nothing
      # fails too, so the gate can never pass vacuously.
      - name: Enforce the coverage floor
        run: go run ./scripts/checkcoverage -profile=coverage.out -min=85

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Publish coverage
        if: github.repository == 'gsoares85/hermes'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Linux webview is a system library; macOS and Windows ship theirs.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Starts PostgreSQL 13, 15, 16, 17 and 18 with testcontainers. Everything
      # that reads the catalog or generates DDL has to pass on all five.
      - name: Run integration tests
        run: go test -race -tags=integration -timeout=20m ./...
