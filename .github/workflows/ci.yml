name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release, not to its tag: a tag is
# mutable, so a compromised maintainer account can rewrite @v4 and run code on
# every runner. The comment names the version the commit belongs to, and
# Dependabot moves both together.
env:
  # Node 20 reached end of life in April 2026, so it no longer receives security
  # patches. 22 is the supported line the frontend is developed and built on.
  NODE_VERSION: "22"
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.7.0

# Every job carries a timeout. Without one GitHub applies its own default of six
# hours, which is not a limit so much as the absence of one: a step that stalls
# rather than fails — an apt mirror that stops answering mid-install is the one
# seen here — holds a runner for the rest of the working day and reports nothing
# while it does. The numbers below are several times the observed duration of
# each job, so they are reached by a hang and not by a slow morning.

jobs:
  commits:
    name: Commit authorship
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Authorship is exclusive and no commit credits an AI assistant. That is a
      # rule of the project, so it is checked by the pipeline instead of trusted
      # to discipline.
      #
      # The branch name is chosen by whoever opens the pull request, and Git
      # allows $, backticks, semicolons and pipes in a ref. Interpolated into
      # run: it would be a command; through the environment it is only ever a
      # value, because the expansion happens before a shell exists.
      - name: Check commits and branch name
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          go run ./scripts/checkcommits \
            -range="$BASE_SHA..$HEAD_SHA" \
            -branch="$BRANCH"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # cmd/hermes imports Wails, so this job type-checks cgo and needs the
      # webview headers even though it never opens a window.
      - uses: ./.github/actions/linux-webview

      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint Go with the integration tag
        run: golangci-lint run --build-tags=integration

      # The suite behind the keychain tag only builds when the tag is set, so
      # without this the one code path that talks to a real keychain would be
      # the one nothing checks.
      - name: Lint Go with the keychain tag
        run: golangci-lint run --build-tags=keychain

      # Lifecycle scripts of every transitive dependency would otherwise run
      # with the credentials of the runner. Linting needs no native binary.
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      # The README is the only public entry point of the repository, so it must
      # never point at files that are not published with it.
      - name: Check README references
        run: make check-readme

  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # cmd/hermes imports Wails, so this job type-checks cgo and needs the
      # webview headers even though it never opens a window.
      - uses: ./.github/actions/linux-webview

      # A product that holds production database credentials cannot take a CVE
      # in a transitive dependency by surprise, so both ecosystems are scanned
      # on every pull request rather than whenever someone remembers.
      - name: Scan the Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: Scan the frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Through make, not by repeating the command: the exclusion list lives in
      # one place. It was written out twice once, the two copies drifted apart,
      # and the result was `make cover` failing on Linux while this job passed —
      # which teaches people to distrust the local command rather than the code.
      - name: Run unit tests and enforce the coverage floor
        run: make cover

      # A gate nobody has seen fail is a gate nobody knows works. This feeds it
      # a profile that is deliberately below the floor and fails the job if the
      # gate accepts it.
      - name: Prove the coverage gate rejects a profile below the floor
        run: |
          printf 'mode: set\ninternal/x/y.go:1.1,2.2 10 0\n' > below-the-floor.out
          if go run ./scripts/checkcoverage -profile=below-the-floor.out -min=85; then
            echo "the coverage gate accepted 0% of 10 statements" && exit 1
          fi
          rm below-the-floor.out

      - name: Upload the coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

      - name: Publish coverage
        if: github.repository == 'gsoares85/hermes'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Linux webview is a system library; macOS and Windows ship theirs.
      - uses: ./.github/actions/linux-webview
        if: runner.os == 'Linux'

      - name: Build the frontend
        run: |
          npm ci --ignore-scripts
          npm run build
        working-directory: frontend

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  # The one job that talks to a real keychain. Everything else in the pipeline
  # runs against the in-memory vault, which is exactly the double the
  # implementations here have to be proven not to be more forgiving than.
  #
  # It fails rather than skips when a runner has no keyring: a skip would turn
  # the job into one that passes by doing nothing, and the difference would only
  # surface on the machine of someone trying to save a password.
  keychain:
    name: Keychain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A GitHub runner has no desktop session, so it has neither a session bus
      # nor a keyring on it. Both are installed and started here, which is the
      # only way the Linux test is the real thing rather than a check that the
      # fallback works.
      - name: Install a keyring and a session bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11 libglib2.0-bin

      # The empty password creates and unlocks the login keyring: a keyring that
      # is locked answers every read with a dialog nobody is there to accept.
      # gdbus waits for the daemon to claim the name, so the test does not race
      # the daemon it just started.
      - name: Run the contract against the keyring of the session
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --unlock --components=secrets
            gdbus wait --session --timeout 10 org.freedesktop.secrets
            go test -tags=keychain -count=1 -timeout=5m ./internal/vault/...
          '

      # macOS and Windows keep the store of the logged-in user running already:
      # the login keychain and the Credential Manager are part of the session.
      - name: Run the contract against the keychain of the system
        if: runner.os != 'Linux'
        run: go test -tags=keychain -count=1 -timeout=5m ./internal/vault/...

  # The other job that can only tell the truth on the machine it runs on. How a
  # command line is read, and what a file permission even means, are different on
  # each of the three systems, so the tests that assert them are written three
  # times and every one of them has to run somewhere.
  #
  # Linux is in the matrix although the unit job already covers it: the point of
  # this job is that the same suite passes on all three, and a matrix with a hole
  # in it is a matrix nobody notices has one.
  credentials:
    name: Credential handoff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Hand a credential to a real child process
        run: go test -race -count=1 -timeout=5m ./internal/credential/...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Above the 20m the test run gives itself, on purpose: when the suite is
    # what hangs, go test hitting its own deadline first prints the stack of
    # every goroutine, and the job being killed instead prints nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # cmd/hermes imports Wails, so this job type-checks cgo and needs the
      # webview headers even though it never opens a window.
      - uses: ./.github/actions/linux-webview

      # Starts PostgreSQL 12, 13, 15, 16, 17 and 18 with testcontainers. 12 is
      # the announced minimum, so it is in the matrix rather than trusted.
      # Everything that reads the catalog or generates DDL passes on all six.
      - name: Run integration tests
        run: go test -race -tags=integration -timeout=20m ./...
