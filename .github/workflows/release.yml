name: Release

# A merged pull request is a release. The workflow runs on the commit that
# actually landed on main, never on the ephemeral merge ref of the pull request:
# a tag has to point at history everyone else can see, and publish.yml builds the
# distributed binaries from that tag. Under a squash or a rebase merge the merge
# ref is not on main at all, so tagging it would publish binaries nobody can
# reproduce from the repository.
#
# Running on main also means the code that computes the version is the reviewed
# code, not the code of the pull request being released.
#
# The size of the bump comes from the release: label on the pull request that
# brought the commit in; without one the workflow falls back to Conventional
# Commits and, failing that, stops and asks for the label instead of guessing a
# version nobody meant.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      # This is the one checkout in the repository that keeps its credentials:
      # the job pushes the tag it creates. Every other job checks out with
      # persist-credentials: false, so the token never sits in .git/config while
      # third-party code runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Re-running a finished release must not publish a second version for the
      # same commit, so an already tagged commit ends the job here.
      - name: Stop if this commit is already released
        id: guard
        run: |
          existing="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$existing" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA is already released as $existing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read the last released tag
        if: steps.guard.outputs.released != 'true'
        id: last
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"

      # The commit is on main, so the pull request that carried it is found from
      # the commit itself. That works for a squash, a rebase and a merge commit
      # alike, and it is why the release no longer needs the pull request event.
      - name: Read the labels of the pull request that landed this commit
        if: steps.guard.outputs.released != 'true'
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[0].labels[]?.name] | join(",")')"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "Release labels: ${labels:-none}"

      # Written to a file, not to an argument: a commit message can contain
      # anything, and nothing from it should reach a shell.
      - name: Collect the commit messages since the last release
        if: steps.guard.outputs.released != 'true'
        env:
          LAST_TAG: ${{ steps.last.outputs.tag }}
        run: |
          range="HEAD"
          if [ -n "$LAST_TAG" ]; then range="$LAST_TAG..HEAD"; fi
          git log --format="%B%x1e" "$range" > commit-messages.txt

      - name: Compute the next version
        if: steps.guard.outputs.released != 'true'
        id: compute
        env:
          LAST_TAG: ${{ steps.last.outputs.tag }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          tag="$(go run ./scripts/nextversion \
            -last="$LAST_TAG" \
            -labels="$LABELS" \
            -messages-file=commit-messages.txt)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (previous: ${LAST_TAG:-none})" >> "$GITHUB_STEP_SUMMARY"

      # Values reach the shell through the environment, never through template
      # interpolation, so nothing carried by the commit can become a command.
      - name: Create the tag
        if: steps.guard.outputs.released != 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
          TAGGER_NAME: ${{ github.event.head_commit.author.name }}
          TAGGER_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          # True by construction on a push to main. Asserted anyway, so that a
          # tag can never be pushed for a commit outside the released history if
          # the trigger of this workflow ever changes.
          git merge-base --is-ancestor HEAD origin/main
          git config user.name "$TAGGER_NAME"
          git config user.email "$TAGGER_EMAIL"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  # Called instead of triggered: a tag pushed with the default token does not
  # start another workflow, and a personal access token with push rights is a
  # long-lived secret this repository does not need.
  publish:
    name: Publish
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
