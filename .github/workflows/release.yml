name: Release

# A merged pull request is a release. The size of the bump comes from the
# release: label on that pull request; without one the workflow falls back to
# Conventional Commits and, failing that, stops and asks for the label instead
# of guessing a version nobody meant.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read the last released tag
        id: last
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"

      # Written to a file, not to an argument: a commit message can contain
      # anything, and nothing from it should reach a shell.
      - name: Collect the commit messages of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: git log --format="%B%x1e" "$BASE_SHA..$HEAD_SHA" > commit-messages.txt

      - name: Compute the next version
        id: compute
        env:
          LAST_TAG: ${{ steps.last.outputs.tag }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          tag="$(go run ./scripts/nextversion \
            -last="$LAST_TAG" \
            -labels="$LABELS" \
            -messages-file=commit-messages.txt)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (previous: ${LAST_TAG:-none})" >> "$GITHUB_STEP_SUMMARY"

      # Values reach the shell through the environment, never through template
      # interpolation, so nothing from the pull request can become a command.
      - name: Create the tag
        env:
          TAG: ${{ steps.compute.outputs.tag }}
          TAGGER_NAME: ${{ github.event.pull_request.merged_by.login }}
          TAGGER_ID: ${{ github.event.pull_request.merged_by.id }}
        run: |
          git config user.name "$TAGGER_NAME"
          git config user.email "${TAGGER_ID}+${TAGGER_NAME}@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  # Called instead of triggered: a tag pushed with the default token does not
  # start another workflow, and a personal access token with push rights is a
  # long-lived secret this repository does not need.
  publish:
    name: Publish
    needs: tag
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
