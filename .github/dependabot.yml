version: 2

# The workflows pin every action to the commit of a release rather than to its
# mutable tag, which is only safe if something keeps those commits current.
# Dependabot is that something: it moves the pin and the version comment
# together, and does the same for the two package ecosystems.
#
# Two settings exist because merging here is not free. Every merge to main cuts
# a release, so an ungrouped weekly run would publish a version, and binaries
# for three platforms, per bumped dependency.
#
#   labels     the release workflow reads the version bump from a release:
#              label, and falls back to Conventional Commits. A dependency bump
#              is written as build: or ci:, neither of which carries a release,
#              so without the label the fallback finds nothing and the release
#              fails. Patch is the right size: CONTRIBUTING calls infrastructure
#              work a patch, and a reviewer can raise it before merging.
#
#   groups     routine minor and patch updates arrive as one pull request per
#              ecosystem. Majors are deliberately left out of the groups: they
#              need a judgement call, so they keep coming one at a time.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "release:patch"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "release:patch"]
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: ["dependencies", "release:patch"]
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build
    ignore:
      # TypeScript 7 is refused, not postponed, and this is here so that the
      # refusal costs a read instead of the investigation again.
      #
      # The 7.0 package no longer exports the compiler API: its "." entry point
      # is lib/version.cjs and everything a tool needs moved under ./unstable/*.
      # typescript-eslint is built on that API, caps its peer range at <6.1.0
      # and refuses to load at all — `eslint .` does not degrade, it dies with
      # "typescript-eslint does not support TS 7.0". So adopting 7 means
      # deleting the typed lint: no-floating-promises, no-misused-promises and
      # no-unnecessary-condition, in a frontend whose whole job is awaiting a
      # binding. tsc itself is fine; the linter is what breaks.
      #
      # Reopen when typescript-eslint supports it — the tracking issue is
      # typescript-eslint#10940, and it targets TS >= 7.1, so the version that
      # exists today is not the one to try. Delete this entry then.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
